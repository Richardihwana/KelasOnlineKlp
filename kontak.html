  <!-- Header -->

    <a href="index.html" class="header__logo">
      <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="Logo Kelas Online" />
      Kelas Online

  <!-- Kontak -->
  <main>
    <section class="contact-section">
      <div class="contact-card">
        <h2>Hubungi Kami</h2>
        <p class="description">Punya pertanyaan atau saran? Kami siap membantu Anda. Isi formulir berikut dan kami akan segera merespons!</p>

        <form action="#" method="post" class="contact-form">
          <input type="text" name="name" placeholder="Nama Anda" required />
          <input type="email" name="email" placeholder="Email Anda" required />
          <textarea name="message" rows="5" placeholder="Pesan Anda" required></textarea>
          <button type="submit" class="btn">Kirim Pesan</button>
        </form>
      </div>
    </section>
  </main>
