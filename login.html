<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Kelas Online</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="background"></div>
  <div class="overlay"></div>

  <header>
    <a href="index.html" class="header__logo">
      <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png"alt="Logo Kelas Online" />
      Kelas Online
    </a>

    <input type="checkbox" id="menu-toggle" aria-label="Toggle menu navigasi" />
    <label for="menu-toggle" class="menu-toggle">
      <i class="bi bi-list"></i>
    </label>

    <nav>
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="about.html">Tentang</a></li>
        <li><a href="courses.html">Kursus</a></li>
        <li><a href="kontak.html">Kontak</a></li>
        <li><a href="login.html" class="btn active">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <<section class="login-container">
      <div class="login-card" data-aos="fade-up" data-aos-delay="100">
        <h2>Selamat Datang 👋</h2>
        <p class="login-subtitle">Masuk untuk melanjutkan pembelajaran Anda</p>
    
        <form id="loginForm" autocomplete="off" data-aos="zoom-in" data-aos-delay="200">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="email@domain.com" required />
    
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" placeholder="Masukkan kata sandi" required />
    
          <div class="forgot-password">
            <a href="#">Lupa kata sandi?</a>
          </div>
    
          <button type="submit" class="btn-login">Masuk <i class="bi bi-box-arrow-in-right"></i></button>
    
          <p id="loginMessage" class="login-message"></p>
        </form>
    
        <p class="register-link">
          Belum punya akun? <a href="#">Daftar di sini</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("loginMessage");

      const validEmail = "admin@kelas.com";
      const validPassword = "admin123";

      if (email === validEmail && password === validPassword) {
        message.style.color = "lightgreen";
        message.innerHTML = "✅ Login berhasil! Selamat datang.";
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1500);
      } else {
        message.style.color = "salmon";
        message.innerHTML = "❌ Email atau kata sandi salah.";
      }
    });
  </script>
   <!-- Footer -->
   <footer>
    <div class="footer-line"></div>
    <p>&copy; 2025 Kelas Online. Semua hak dilindungi.</p>
    <div class="footer-social">
      <a href="#"><i class="bi bi-instagram"></i></a>
      <a href="#"><i class="bi bi-twitter"></i></a>
      <a href="#"><i class="bi bi-youtube"></i></a>
    </div>
  </footer>

  <!-- AOS JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
